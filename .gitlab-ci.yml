workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

stages:
  - test

repo:smoke:
  stage: test
  image: alpine:3.21
  before_script:
    - apk add --no-cache bash
  script:
    - bash -n scripts/check-local-identity-leaks.sh
    - test -f README.md
    - test -f LICENSE
